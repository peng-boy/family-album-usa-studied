<!doctype html><meta charset="utf-8"><title>Running</title><pre id="result">RUNNING</pre>
<iframe id="app" src="/index.html#ep1" style="width:375px;height:740px;border:0"></iframe>
<script>
(async()=>{
 const result=document.getElementById('result'),frame=document.getElementById('app'),checks=[];
 function check(value,label){if(!value)throw Error(label);checks.push(label)}
 try{
  await new Promise((resolve,reject)=>{const deadline=Date.now()+10000;const timer=setInterval(()=>{if(frame.contentDocument.querySelector('[data-play-mode]')){clearInterval(timer);resolve()}else if(Date.now()>deadline){clearInterval(timer);reject(Error('App timed out'))}},50)});
  const w=frame.contentWindow,d=frame.contentDocument,a=d.querySelector('audio'),card=d.querySelector('.audio-player');
  // Deterministic DOM integration: simulate media state to avoid headless virtual-time
  // media decoding races. Actual MP3 serving is checked separately with HTTP ranges.
  let paused=true;
  Object.defineProperty(a,'paused',{get:()=>paused});
  Object.defineProperty(a,'duration',{get:()=>244});
  Object.defineProperty(a,'ended',{get:()=>false});
  a.play=()=>{paused=false;a.dispatchEvent(new Event('play'));return Promise.resolve()};
  a.pause=()=>{paused=true;a.dispatchEvent(new Event('pause'))};
  const lesson=await(await fetch('/episodes.json')).json(),lines=lesson.episodes[0].acts[0].lines;
  check(w.getComputedStyle(card).position==='fixed','Mobile player is fixed');
  const box=card.getBoundingClientRect(),nav=d.querySelector('.mobile-nav').getBoundingClientRect();
  check(box.left>=0&&box.right<=375,'Player fits narrow viewport');
  check(w.getComputedStyle(d.querySelector('.mobile-nav')).display==='none','Bottom tab bar hidden');
   check(box.bottom<=740&&box.bottom>700,'Player near viewport bottom');
   check(w.getComputedStyle(d.querySelector('.mobile-player-selects')).display==='flex','Mobile selects visible');
   check(w.getComputedStyle(d.querySelector('.sentence-controls')).display==='none','Mode buttons hidden on mobile');
   check(w.getComputedStyle(a).display==='none','Native progress bar hidden on mobile');
    check(box.height<=64,'Collapsed player fits a single compact row');
    check(!d.querySelector('.sync-hint'),'Verbose sync hint removed');
    check(w.getComputedStyle(d.querySelector('.ab-controls')).display==='none','AB controls collapsed by default');
    const play=d.querySelector('.mobile-play-toggle');
    play.click();check(!a.paused&&play.getAttribute('aria-label')==='暂停','Play button starts audio and shows pause');
    play.click();check(a.paused&&play.getAttribute('aria-label')==='播放','Pause button pauses audio and shows play');
    const follow=d.querySelector('.follow-toggle');
    check(follow.textContent==='跟随'&&follow.classList.contains('active'),'Follow is concise and highlighted when enabled');
    follow.click();check(follow.textContent==='跟随'&&!follow.classList.contains('active')&&follow.getAttribute('aria-pressed')==='false','Follow toggles highlight without changing text');
    follow.click();
    const modeSelect=d.getElementById('mode-select');modeSelect.value='ab';modeSelect.dispatchEvent(new Event('change'));
    check(w.getComputedStyle(d.querySelector('.ab-controls')).display==='flex','Choosing AB reveals setup before points exist');
    modeSelect.value='continuous';modeSelect.dispatchEvent(new Event('change'));
    check(w.getComputedStyle(d.querySelector('.ab-controls')).display==='none','Choosing continuous collapses AB setup');
    for(const width of [320,375,430,768]){
      frame.style.width=width+'px';await new Promise(resolve=>setTimeout(resolve,50));
      const bounds=card.getBoundingClientRect();
      check(bounds.height<=64&&card.scrollWidth<=card.clientWidth,'Compact player fits '+width+'px without overflow');
      for(const control of [play,d.getElementById('speed-select'),modeSelect,follow]){
        const rect=control.getBoundingClientRect();
        check(rect.top>=bounds.top&&rect.bottom<=bounds.bottom&&rect.left>=bounds.left&&rect.right<=bounds.right,'Control stays in single row at '+width+'px');
      }
    }
    frame.style.width='375px';await new Promise(resolve=>setTimeout(resolve,50));
    const speed=d.getElementById('speed-select');speed.value='0.5';speed.dispatchEvent(new Event('change'));
   check(a.playbackRate===.5,'Speed select changes playback rate');
  check(d.querySelector('[data-play-mode="loop"]').closest('.audio-player')===card,'Loop control is inside player card');
  w.setSpeed(.5);check(a.playbackRate===.5,'Half speed works');
  w.setPlaybackMode('once');w.seekToLine(0);await a.play();
  a.currentTime=lines[1].t;a.dispatchEvent(new Event('timeupdate'));
  check(a.paused,'Once mode pauses at next sentence');
  check(Math.abs(a.currentTime-lines[0].t)<.1,'Once mode resets for replay');
  w.setPlaybackMode('loop');w.seekToLine(0);await a.play();
  a.currentTime=lines[1].t;a.dispatchEvent(new Event('timeupdate'));
  check(!a.paused&&Math.abs(a.currentTime-lines[0].t)<.1,'Loop returns to selected sentence');
  a.pause();a.currentTime=20;w.markAB('a');a.currentTime=19;w.markAB('b');
   check(d.getElementById('ab-status').textContent.includes('至少'),'Invalid B shows validation');
   a.currentTime=23;w.markAB('b');
   check(d.getElementById('mode-select').value==='ab','Setting B activates AB mode');
   await a.play();a.currentTime=23;a.dispatchEvent(new Event('timeupdate'));
   check(a.currentTime===20&&!a.paused,'AB loops within chosen points');
   w.clearAB();check(d.getElementById('mode-select').value==='continuous','Clearing AB restores continuous');
   const mode=d.getElementById('mode-select');mode.value='loop';mode.dispatchEvent(new Event('change'));
   check(d.querySelector('[data-play-mode="loop"]').getAttribute('aria-pressed')==='true','Mode select syncs mode');
   a.pause();w.selectAct(1);check(a.paused,'Act switch stops looping old audio');
  check(d.querySelector('[data-play-mode="loop"]').getAttribute('aria-pressed')==='true','Mode persists across acts');
  w.goHome();check(d.querySelector('#detail-wrap').style.display==='none','Home hides fixed player');
  result.textContent='PASS\n'+checks.join('\n');document.title='PASS';
 }catch(e){result.textContent='FAIL '+e.stack;document.title='FAIL'}
})();
</script>
